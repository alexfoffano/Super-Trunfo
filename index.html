<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Trunfo Digital</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Title Screen -->
        <section id="title-screen" class="screen active">
            <div class="logo-container">
                <h1 class="glitch" data-text="SUPER TRUNFO">SUPER DUELO</h1>
                <p class="subtitle">AGORA ONLINE!</p>
            </div>
            <button id="btn-play" class="primary-btn pulse">JOGAR!</button>
        </section>

        <!-- Setup Screen -->
        <section id="setup-screen" class="screen hide">
            <h2 class="title-small">CONFIGURAÇÃO DA PARTIDA</h2>
            <div class="setup-form glass-panel">
                <div class="form-group">
                    <label for="player-name">Seu Nome:</label>
                    <input type="text" id="player-name" value="Você" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="human-count">Número de Jogadores (<span id="human-val">1</span>):</label>
                    <input type="range" id="human-count" min="0" max="8" value="1">
                </div>
                <div class="form-group">
                    <label for="bot-count">Número de Bots (<span id="bot-val">1</span>):</label>
                    <input type="range" id="bot-count" min="0" max="8" value="1">
                </div>

                <div class="form-group deck-selection">
                    <label>Baralho:</label>
                    <select id="deck-select">
                        <option value="cars">Carros (Padrão)</option>
                        <option value="pokemon">Pokémon</option>
                        <option value="brasilidades">Brasilidades (Novo!)</option>
                        <option value="template">Novo Baralho (Template)</option>
                    </select>
                </div>
                <button id="btn-start-setup" class="primary-btn">CRIAR SALA/JOGAR</button>
                <button id="btn-back-setup" class="secondary-btn" style="margin-top: 15px; width: 100%;">VOLTAR</button>
            </div>
        </section>

        <!-- Lobby Screen -->
        <section id="lobby-screen" class="screen hide">
            <h2 class="title-small">SALA DE ESPERA</h2>
            <div class="setup-form glass-panel" style="text-align: center;">
                <p>Convide seus amigos enviando o link abaixo:</p>
                <div class="invite-link-box" style="display:flex; margin-bottom: 20px; gap: 10px;">
                    <input type="text" id="invite-link" readonly style="flex:1;">
                    <button id="btn-copy-link" style="padding: 10px; cursor:pointer;" title="Copiar">📋</button>
                </div>

                <h3 style="margin-bottom: 10px; color: var(--secondary-color);">Jogadores na Sala (<span
                        id="lobby-count">1</span>/<span id="lobby-total">1</span> humanos)</h3>
                <ul id="lobby-players-list"
                    style="list-style: none; padding: 0; margin-bottom: 20px; text-align: left; max-height: 200px; overflow-y:auto;">
                    <!-- Player items will appear here -->
                </ul>

                <button id="btn-start-multiplayer" class="primary-btn" disabled>INICIAR JOGO</button>
                <button id="btn-back-lobby" class="secondary-btn" style="margin-top: 15px; width: 100%;">SAIR DA SALA</button>
            </div>
        </section>

        <!-- Join Screen -->
        <section id="join-screen" class="screen hide">
            <h2 class="title-small">ENTRAR NA SALA</h2>
            <div class="setup-form glass-panel">
                <div class="form-group">
                    <label for="join-name">Seu Nome:</label>
                    <input type="text" id="join-name" value="" placeholder="Digite seu nome" maxlength="20">
                </div>
                <button id="btn-join-room" class="primary-btn">ENTRAR</button>
                <button id="btn-back-join" class="secondary-btn" style="margin-top: 15px; width: 100%;">CANCELAR</button>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen hide">
            <header class="game-header glass-panel">
                <div class="turn-indicator"><span id="turn-text">Vez de </span><span id="current-player-name"
                        class="highlight">1</span></div>
                <div id="pool-indicator" class="pool-indicator hide">Cartas acumuladas: <span id="pool-count">0</span>
                </div>
            </header>

            <div class="game-area">
                <div class="player-area">
                    <div id="p1-card-container" class="card-container">
                        <!-- Card goes here -->
                    </div>
                </div>

                <div class="players-area" id="players-container">
                    <!-- Player stats go here -->
                </div>
            </div>

            <div id="action-log" class="glass-panel log-panel">
                <ul id="log-list">
                    <li>O jogo começou! Boa sorte.</li>
                </ul>
            </div>

            <!-- Round Result Overlay -->
            <div id="round-result-overlay" class="overlay hide">
                <div class="glass-panel result-panel">
                    <h3 id="round-result-winner"
                        style="text-align:center; color: var(--secondary-color); margin-bottom: 20px;"></h3>
                    <div id="round-result-list" class="result-list">
                        <!-- Cards will be populated here -->
                    </div>
                    <button id="btn-continue" class="primary-btn"
                        style="margin-top: 20px; width: 100%;">Continuar</button>
                </div>
            </div>

            <!-- Turn Overlay -->
            <div id="turn-overlay" class="turn-overlay">
                <h1 id="turn-overlay-text"></h1>
            </div>
        </section>

        <!-- End Screen -->
        <section id="end-screen" class="screen hide">
            <div class="end-glass glass-panel">
                <h1 id="winner-name" class="glitch" data-text="VITÓRIA!">VITÓRIA!</h1>
                <p id="winner-msg">O jogo terminou!</p>
                <button id="btn-restart" class="primary-btn">SAIR DA PARTIDA</button>
            </div>
        </section>
    </div>

    <!-- Firebase (Compat v8 layout) -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

    <!-- Scripts -->
    <script src="decks/cars/cars.js"></script>
    <script src="decks/brasilidades/brasilidades.js"></script>
    <script src="decks/template/template.js"></script>
    <script src="decks/pokemon/pokemon.js"></script>
    <script src="cards.js"></script>
    <script src="network.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>

</html>
