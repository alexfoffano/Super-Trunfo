<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Trunfo Digital</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Title Screen -->
        <section id="title-screen" class="screen active">
            <div class="logo-container">
                <h1 class="glitch" data-text="SUPER TRUNFO">SUPER TRUNFO</h1>
                <p class="subtitle">EDIÇÃO CARROS</p>
            </div>
            <button id="btn-play" class="primary-btn pulse">JOGAR!</button>
        </section>

        <!-- Setup Screen -->
        <section id="setup-screen" class="screen hide">
            <h2 class="title-small">CONFIGURAÇÃO DA PARTIDA</h2>
            <div class="setup-form glass-panel">
                <div class="form-group">
                    <label for="player-count">Número de Jogadores (2 a 8):</label>
                    <input type="number" id="player-count" min="2" max="8" value="2">
                </div>
                <p class="bot-info">Você será o <strong>Jogador 1</strong>. Os demais jogadores serão controlados pelo bot.</p>
                <div class="form-group deck-selection">
                    <label>Baralho:</label>
                    <select id="deck-select">
                        <option value="cars">Carros (Padrão)</option>
                        <option value="pokemon">Pokémon</option>
                        <option value="brasilidades">Brasilidades (Novo!)</option>
                        <option value="template">Novo Baralho (Template)</option>
                    </select>
                </div>
                <button id="btn-start" class="primary-btn">INICIAR PARTIDA</button>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen hide">
            <header class="game-header glass-panel">
                <div class="turn-indicator">Turno do Jogador: <span id="current-player-name" class="highlight">1</span></div>
                <div id="pool-indicator" class="pool-indicator hide">Cartas na Mesa (Empate): <span id="pool-count">0</span></div>
            </header>

            <div class="game-area">
                <div class="player-area">
                    <h3 class="area-title">Sua Carta (Jogador 1 - Cartas Restantes: <span id="p1-card-count">0</span>)</h3>
                    <div id="p1-card-container" class="card-container">
                        <!-- Card goes here -->
                    </div>
                </div>

                <div class="opponents-area" id="opponents-container">
                    <!-- Opponent stats go here -->
                </div>
            </div>

            <div id="action-log" class="glass-panel log-panel">
                <ul id="log-list">
                    <li>O jogo começou! Boa sorte.</li>
                </ul>
            </div>

            <!-- Round Result Overlay -->
            <div id="round-result-overlay" class="overlay hide">
                <div class="glass-panel result-panel">
                    <h2 class="title-small" style="font-size:1.8rem; margin-bottom: 0;">Resultado da Rodada</h2>
                    <h3 id="round-result-winner" style="text-align:center; color: var(--secondary-color); margin-bottom: 20px;"></h3>
                    <div id="round-result-list" class="result-list">
                        <!-- Cards will be populated here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- End Screen -->
        <section id="end-screen" class="screen hide">
            <div class="end-glass glass-panel">
                <h1 id="winner-name" class="glitch" data-text="VITÓRIA!">VITÓRIA!</h1>
                <p id="winner-msg">O jogo terminou!</p>
                <button id="btn-restart" class="primary-btn">JOGAR NOVAMENTE</button>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="decks/cars/cars.js"></script>
    <script src="decks/brasilidades/brasilidades.js"></script>
    <script src="decks/template/template.js"></script>
	<script src="decks/pokemon/pokemon.js"></script>
    <script src="cards.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
